<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicFake - Verifikasi Keaslian Foto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        #map { height: 250px; width: 100%; border-radius: 12px; z-index: 10; }
        .frosted { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center py-6 px-4">

    <!-- Header Logo -->
    <div class="mb-6 text-center">
        <h1 class="text-2xl font-black text-slate-800 tracking-tighter italic">PICFAKE <span class="text-yellow-500">VERIFY</span></h1>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-md bg-white shadow-2xl rounded-3xl overflow-hidden border border-slate-100">

        <!-- Peta (Tetap di atas atau di tengah hasil) -->
        <div id="mapContainer" class="hidden">
            <div id="map"></div>
        </div>

        <div class="p-6">
            <!-- Search Section -->
            <div id="searchSection">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Masukan Kode Verifikasi</p>
                <div class="flex gap-2">
                    <input type="text" id="photoCodeInput" placeholder="CONTOH: ABC123XYZ"
                           class="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-yellow-500 outline-none font-mono uppercase">
                    <button onclick="verifyCode()" class="bg-slate-900 text-white px-6 py-3 rounded-xl font-bold active:scale-95 transition">CEK</button>
                </div>
            </div>

            <!-- Loading -->
            <div id="loading" class="hidden py-10 text-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-yellow-500 mx-auto"></div>
                <p class="text-slate-400 text-xs mt-3">Mencocokkan data server...</p>
            </div>

            <!-- Result Data (Ala Timemark) -->
            <div id="dataCard" class="hidden mt-4 space-y-6">

                <!-- Status Badge -->
                <div id="statusBadge" class="inline-flex items-center px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider">
                    <span id="statusIcon" class="mr-1.5"></span>
                    <span id="statusTitle"></span>
                </div>

                <!-- Info Grid -->
                <div class="space-y-5">
                    <div>
                        <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">📍 Alamat Pengambilan</p>
                        <p id="resAddress" class="text-sm font-bold text-slate-800 leading-snug"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">⏰ Waktu / Tanggal</p>
                            <p id="resTime" class="text-xs font-semibold text-slate-700"></p>
                        </div>
                        <div>
                            <p class="text-[9px] font-bold text-slate-400 uppercase mb-1">🌍 Koordinat GPS</p>
                            <p id="resCoords" class="text-xs font-mono text-slate-700"></p>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-100 grid grid-cols-2 gap-2 text-[9px] font-medium text-slate-400">
                        <p id="resDevice"></p>
                        <p id="resAccuracy" class="text-right"></p>
                    </div>
                </div>

                <button onclick="window.location.reload()" class="w-full py-3 text-slate-400 text-[10px] font-bold uppercase tracking-widest border-2 border-dashed border-slate-100 rounded-xl hover:bg-slate-50 transition">
                    Verifikasi Kode Lain
                </button>
            </div>

            <!-- Not Found -->
            <div id="notFound" class="hidden py-8 text-center space-y-3">
                <div class="text-4xl">❌</div>
                <h3 class="font-black text-slate-800">DATA TIDAK DITEMUKAN</h3>
                <p class="text-xs text-slate-400 px-6">Kode foto ini tidak terdaftar atau data telah dihapus dari sistem kami.</p>
            </div>
        </div>
    </div>

    <p class="mt-8 text-[9px] font-bold text-slate-300 uppercase tracking-widest">Powered by PicFake Anti-Tamper Tech</p>

    <script>
        const firebaseConfig = {
            databaseURL: "https://compicfake-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let map = null;

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const codeFromUrl = urlParams.get('code');
            if (codeFromUrl) {
                document.getElementById('photoCodeInput').value = codeFromUrl.toUpperCase();
                verifyCode();
            }
        };

        function verifyCode() {
            const code = document.getElementById('photoCodeInput').value.trim().toUpperCase();
            if (!code) return;

            const loading = document.getElementById('loading');
            const dataCard = document.getElementById('dataCard');
            const notFound = document.getElementById('notFound');
            const mapContainer = document.getElementById('mapContainer');
            const searchSection = document.getElementById('searchSection');

            loading.classList.remove('hidden');
            dataCard.classList.add('hidden');
            notFound.classList.add('hidden');
            mapContainer.classList.add('hidden');

            database.ref('verifications/' + code).once('value').then((snapshot) => {
                loading.classList.add('hidden');

                if (snapshot.exists()) {
                    const val = snapshot.val();
                    dataCard.classList.remove('hidden');
                    mapContainer.classList.remove('hidden');
                    searchSection.classList.add('hidden');

                    document.getElementById('resAddress').innerText = val.address;
                    document.getElementById('resCoords').innerText = val.latitude.toFixed(6) + ", " + val.longitude.toFixed(6);

                    // Update Status Badge
                    const badge = document.getElementById('statusBadge');
                    const title = document.getElementById('statusTitle');
                    const icon = document.getElementById('statusIcon');

                    if (val.isFake) {
                        badge.className = "inline-flex items-center px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-red-100 text-red-600";
                        title.innerText = "Lokasi Dimanipulasi (FAKE)";
                        icon.innerText = "⚠️";
                    } else {
                        badge.className = "inline-flex items-center px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-green-100 text-green-600";
                        title.innerText = "Data Asli & Terverifikasi";
                        icon.innerText = "✅";
                    }

                    // Format Time
                    const date = new Date(val.timestamp);
                    document.getElementById('resTime').innerText = date.toLocaleTimeString('id-ID') + " - " + date.toLocaleDateString('id-ID');

                    // Metadata
                    if(val.metadata) {
                        document.getElementById('resDevice').innerText = "DEVICE: " + (val.metadata.deviceModel || "-");
                        document.getElementById('resAccuracy').innerText = "ACCURACY: ±" + (val.metadata.accuracy ? val.metadata.accuracy.toFixed(1) : "0") + "M";
                    }

                    // Initialize Map
                    initMap(val.latitude, val.longitude, val.address);

                } else {
                    notFound.classList.remove('hidden');
                }
            }).catch(e => {
                alert("Error Database: " + e.message);
                loading.classList.add('hidden');
            });
        }

        function initMap(lat, lon, addr) {
            // Jeda 500ms agar kontainer HTML siap dirender browser
            setTimeout(() => {
                const mapDiv = document.getElementById('map');
                if (!mapDiv) return;

                if (map != null) {
                    map.remove();
                    map = null;
                }

                map = L.map('map', {
                    zoomControl: false,
                    attributionControl: false
                }).setView([lat, lon], 19); // Zoom ditingkatkan ke 19 (Sangat Detail/Street Level)

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 20 // Memungkinkan zoom lebih dalam
                }).addTo(map);

                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: "<div style='background-color:#EAB308; width:18px; height:18px; border-radius:50%; border:3px solid white; box-shadow: 0 0 15px rgba(0,0,0,0.5);'></div>",
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                });

                L.marker([lat, lon], {icon: customIcon}).addTo(map)
                    .bindPopup("<b>Lokasi Foto</b><br>" + addr).openPopup();

                // Paksa refresh ukuran peta agar tidak blank
                map.invalidateSize();
            }, 500);
        }
    </script>
</body>
</html>
